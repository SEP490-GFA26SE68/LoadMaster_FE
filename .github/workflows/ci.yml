# CI cho LoadMaster FE (LM-006). Chạy lint, kiểm kiểu, unit test, build và E2E.
# Benchmark FPS 3D (tests/viewer-benchmark.mjs) không chạy ở đây: SwiftShader không đại diện thiết bị thật (AGENTS mục 7).
name: CI

on:
  push:
    branches: [main, developer, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, developer]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # đọc phiên bản pnpm từ "packageManager" trong package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tsc -b kiểm cả app, config Vite/Vitest, e2e và các file *.test-d.ts
      - run: pnpm exec tsc -b

  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # Ba máy chạy song song, mỗi máy một phần ba số file spec (Playwright chia theo file vì `fullyParallel: false`); mỗi máy vẫn
  # một worker — SwiftShader và các suite đo frame không chịu được chạy chen nhau (playwright.config.ts).
  e2e:
    name: E2E (Playwright) ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, typecheck]
    strategy:
      # Một phần đỏ không huỷ hai phần kia: cần thấy đủ danh sách test đỏ trong một lượt
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium của đúng phiên bản @playwright/test trong lockfile, kèm thư viện hệ thống
      - run: pnpm exec playwright install --with-deps chromium
      # CI=true: server Vite mới cho mỗi lượt, retries 1, forbidOnly (playwright.config.ts)
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7
